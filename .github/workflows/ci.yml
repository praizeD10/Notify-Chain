name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  dependency-licenses:
    name: NPM license policy (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dashboard
          - frontend
          - listener
          - tools/filters-cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Setup Node for license audit
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install license audit tooling
        run: npm install --global --ignore-scripts --no-audit --no-fund license-checker-rseidelsohn@5.0.1 spdx-expression-parse@4.0.0

      - name: Check dependency licenses
        working-directory: ${{ matrix.package }}
        run: |
          export NODE_PATH="$(npm root --global)"
          node --test "$GITHUB_WORKSPACE/scripts/check-npm-licenses.test.mjs"
          license-checker-rseidelsohn --json --excludePrivatePackages | node "$GITHUB_WORKSPACE/scripts/check-npm-licenses.mjs" -

  rust-licenses:
    name: Rust license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: contract/Cargo.toml
          command: check licenses

  format:
    name: Formatting checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Check dashboard formatting (Prettier)
        working-directory: dashboard
        run: npm run format:check

      - name: Install listener dependencies
        working-directory: listener
        run: npm ci

      - name: Check listener formatting (Prettier)
        working-directory: listener
        run: npm run format:check

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Run lint
        working-directory: dashboard
        run: npm run lint
      - name: TypeScript check (build)
        working-directory: dashboard
        run: npm run build
      - name: Run tests
        working-directory: dashboard
        run: npm test --silent
      - name: Run wallet integration tests
        working-directory: dashboard
        run: npm run test:wallet --silent
      - name: Upload wallet test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-integration-report
          path: dashboard/reports/wallet-integration.json

  listener:
    name: Listener (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: listener/package-lock.json
      - name: Install dependencies
        working-directory: listener
        run: npm ci
      - name: Run lint
        working-directory: listener
        run: npm run lint
      - name: TypeScript check
        working-directory: listener
        run: npm run typecheck
      - name: Run tests
        working-directory: listener
        run: npm test --silent

  check-migrations:
    name: Check Pending Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: listener/package-lock.json
      - name: Install dependencies
        working-directory: listener
        run: npm ci
      - name: Create test database and apply all migrations
        working-directory: listener
        run: |
          mkdir -p ./data
          npm run migrate
      - name: Check for pending migrations
        working-directory: listener
        run: npm run check-migrations

  rust:
    name: Rust (fmt check, tests, fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Check formatting
        working-directory: contract
        run: |
          rustup component add rustfmt || true
          cargo fmt --all -- --check
      - name: Run unit tests
        working-directory: contract
        run: cargo test --workspace --all-features --verbose
      - name: Run fuzz tests
        working-directory: contract
        run: cargo test fuzz_ --verbose -- --nocapture
      - name: Generate fuzz coverage report
        run: bash scripts/run-fuzz-coverage.sh
      - name: Upload fuzz coverage report
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-coverage-report
          path: contract/reports/fuzz-coverage.json
